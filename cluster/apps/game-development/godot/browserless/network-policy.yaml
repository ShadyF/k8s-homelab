apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: godot-browserless-network
  namespace: game-development
  labels:
    app.kubernetes.io/name: godot-browserless
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: godot-browserless
      app.kubernetes.io/component: visual-check
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow only Orychamber to connect to the dedicated Browserless CDP port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orychamber
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution for the dedicated Godot web service lookup.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow visual checks to reach only the Godot Webtop service.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: godot
              app.kubernetes.io/component: ide
      ports:
        - protocol: TCP
          port: 3000
