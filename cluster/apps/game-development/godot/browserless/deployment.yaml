apiVersion: apps/v1
kind: Deployment
metadata:
  name: godot-browserless
  namespace: game-development
  labels:
    app.kubernetes.io/name: godot-browserless
    app.kubernetes.io/component: visual-check
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: godot-browserless
      app.kubernetes.io/component: visual-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: godot-browserless
        app.kubernetes.io/component: visual-check
      annotations:
        godot.home.arpa/pod-template-revision: "1"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browserless
          # renovate: datasource=docker depName=ghcr.io/browserless/chrome versioning=docker
          image: ghcr.io/browserless/chrome:v2.56.7
          imagePullPolicy: IfNotPresent
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: godot-access-v1
                  key: browserless_token
            - name: CONNECTION_TIMEOUT
              value: "120000"
          ports:
            - name: chrome
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
