apiVersion: apps/v1
kind: Deployment
metadata:
  name: godot
  namespace: game-development
  labels:
    app.kubernetes.io/name: godot
    app.kubernetes.io/component: ide
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: godot
      app.kubernetes.io/component: ide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: godot
        app.kubernetes.io/component: ide
      annotations:
        godot.home.arpa/pod-template-revision: "1"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webtop
          # renovate: datasource=docker depName=lscr.io/linuxserver/webtop versioning=loose
          image: lscr.io/linuxserver/webtop:ubuntu-xfce-version-ce206d66
          imagePullPolicy: IfNotPresent
          env:
            # Install SSH and ZIP support through LinuxServer's supported runtime package mod.
            - name: DOCKER_MODS
              value: lscr.io/linuxserver/mods:universal-package-install
            - name: INSTALL_PACKAGES
              value: openssh-server|unzip
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
            - name: DISABLE_SUDO
              value: "true"
            - name: PASSWORD_ACCESS
              value: "false"
            - name: PIXELFLUX_WAYLAND
              value: "false"
            - name: SELKIES_AUDIO_ENABLED
              value: "true"
            - name: SELKIES_CLIPBOARD_ENABLED
              value: "true"
            - name: SELKIES_FILE_TRANSFERS
              value: upload,download
            - name: TITLE
              value: Godot .NET IDE
            - name: GODOT_SSH_AUTHORIZED_KEY
              valueFrom:
                secretKeyRef:
                  name: godot-access-v1
                  key: id_ed25519.pub
            - name: GODOT_SSH_HOST_ED25519_KEY
              valueFrom:
                secretKeyRef:
                  name: godot-access-v1
                  key: ssh_host_ed25519_key
            - name: GODOT_SSH_HOST_ED25519_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: godot-access-v1
                  key: ssh_host_ed25519_public_key
          ports:
            - name: web
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  # Require the s6 service configuration and a live SSH banner before serving traffic.
                  test -f /run/godot-sshd-configured
                  exec 3<>/dev/tcp/127.0.0.1/2222
                  IFS= read -r -t 2 banner <&3
                  case "$banner" in SSH-2.0-*) ;; *) exit 1 ;; esac
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # The pinned image needs these capabilities for package setup, ownership changes, UID/GID switching, and sshd sandboxing.
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
                - SYS_CHROOT
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /config
            - name: shm
              mountPath: /dev/shm
            - name: ssh-init
              mountPath: /custom-cont-init.d
              readOnly: true
            - name: ssh-service
              mountPath: /custom-services.d
              readOnly: true
      initContainers:
        - name: install-artifacts
          # Use Python 3.13.15 on Alpine 3.24 for the tarfile data filter and streaming hash API.
          image: python:3.13.15-alpine3.24
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/godot-bootstrap/install-artifacts.py
          envFrom:
            - configMapRef:
                name: godot-artifacts
          securityContext:
            runAsNonRoot: true
            runAsUser: 911
            runAsGroup: 911
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /config
            - name: bootstrap
              mountPath: /opt/godot-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: godot-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: bootstrap
          configMap:
            name: godot-bootstrap
            defaultMode: 0555
        - name: ssh-init
          configMap:
            name: godot-bootstrap
            defaultMode: 0555
            items:
              - key: configure-ssh.sh
                path: configure-ssh.sh
        - name: ssh-service
          configMap:
            name: godot-bootstrap
            defaultMode: 0555
            items:
              - key: run-sshd
                path: run-sshd
        - name: tmp
          emptyDir: {}
