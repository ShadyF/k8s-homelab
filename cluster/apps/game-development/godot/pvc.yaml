apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: godot-data
  namespace: game-development
  labels:
    app.kubernetes.io/name: godot
    app.kubernetes.io/component: data
  # Retain durable editor state during rollback or temporary manifest removal.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 25Gi
