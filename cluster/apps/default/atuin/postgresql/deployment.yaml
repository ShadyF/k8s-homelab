apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin-postgresql
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atuin-postgresql
  template:
    metadata:
      labels:
        app: atuin-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:19.0
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: atuin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atuin-postgresql-secrets
                  key: ATUIN_DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: atuin-postgresql-secrets
                  key: ATUIN_DB_USERNAME
          lifecycle:
            preStop:
              exec:
                # This ensures graceful shutdown see: https://stackoverflow.com/a/75829325/3437018
                # Potentially consider using a `StatefulSet` instead of a `Deployment`
                # pg_ctl refuses to run as root, and it reads the data directory from the image's PGDATA.
                command: [ "gosu", "postgres", "pg_ctl", "stop", "-w", "-t", "60", "-m", "fast" ]
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 250m
              memory: 100Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: database
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: atuin-postgresql-data
