apiVersion: v1
kind: ConfigMap
metadata:
  name: we-usage-tracker-config
  namespace: default
data:
  OPENROUTER_CAPTCHA_MODEL: google/gemini-2.5-flash-lite
  WE_TIMEZONE: Africa/Cairo
  WE_SESSION_FILE: /data/we-session.json
  WE_ALERT_LOW_QUOTA_ENABLED: "true"
  WE_ALERT_LOW_QUOTA_THRESHOLD_GB: "20"
  WE_ALERT_RENEWAL_SOON_ENABLED: "false"
  WE_ALERT_RENEWAL_LEAD_DAYS: "3"
  WE_ALERT_RENEWAL_BALANCE_ENABLED: "false"
  WE_ALERT_BALANCE_BUFFER_EGP: "0"
  WE_ALERT_RENEWAL_RISK_ENABLED: "true"
  WE_ALERT_LOGIN_FAILURE_ENABLED: "true"
  WE_ALERT_CAPTCHA_FAILURE_ENABLED: "true"
  WE_ALERT_API_FAILURE_ENABLED: "true"
  WE_ALERT_REPEAT_AFTER_SECONDS: "21600"
  WE_ALERT_NOTIFY_ON_RECOVERY: "true"
  WE_CHECK_INTERVAL_MINUTES: "120"
  WE_CHECK_JITTER_MINUTES: "15"