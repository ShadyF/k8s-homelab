apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-postgresql
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n-postgresql
  template:
    metadata:
      labels:
        app: n8n-postgresql
    spec:
      # Temporary cleanup of the PostgreSQL 18 backups left by the 18 to 19 migration.
      # Remove this init container once it has run.
      initContainers:
        - name: remove-postgres-18-backup
          image: postgres:19.0
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -eu
              base=/var/lib/postgresql

              # Delete the v18 dump and data only when the v19 cluster exists, so the backup is never the last copy.
              if [ -s "$base/19/docker/PG_VERSION" ]; then
                rm -rf "$base/18-to-19.sql" "$base/18"
                echo "Removed PostgreSQL 18 backups"
              fi
          resources:
            requests:
              cpu: 26m
              memory: 100Mi
            limits:
              memory: 100Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: database
      containers:
        - name: postgresql
          image: postgres:19.0
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-postgresql-secrets
                  key: N8N_DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-postgresql-secrets
                  key: N8N_DB_USERNAME
          lifecycle:
            preStop:
              exec:
                # pg_ctl refuses to run as root, and it reads the data directory from the image's PGDATA.
                command: [ "gosu", "postgres", "pg_ctl", "stop", "-w", "-t", "60", "-m", "fast" ]
          resources:
            requests:
              cpu: 26m
              memory: 100Mi
            limits:
              memory: 100Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: database
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: n8n-postgresql-data
