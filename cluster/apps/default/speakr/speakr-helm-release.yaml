# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speakr
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      version: 5.0.1
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            image:
              repository: docker.io/learnedmachine/speakr
              tag: 0.10.2-alpha-lite
              pullPolicy: IfNotPresent
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              - name: ADMIN_USERNAME
                value: admin
              - name: ADMIN_EMAIL
                value: "admin@${SECRET_DOMAIN}"
              - name: ALLOW_REGISTRATION
                value: "false"
              - name: SESSION_COOKIE_SECURE
                value: "true"
              - name: SECURITY_HEADERS_ENABLED
                value: "true"
              - name: TRUSTED_PROXY_HOPS
                value: "1"
              - name: TRANSCRIPTION_CONNECTOR
                value: openai_whisper
              - name: TRANSCRIPTION_BASE_URL
                value: https://openrouter.ai/api/v1
              - name: TRANSCRIPTION_MODEL
                value: openai/gpt-4o-mini-transcribe
              - name: TEXT_MODEL_BASE_URL
                value: https://openrouter.ai/api/v1
              - name: TEXT_MODEL_NAME
                value: openai/gpt-4o-mini
              - name: EMBEDDING_BASE_URL
                value: https://openrouter.ai/api/v1
              - name: EMBEDDING_MODEL
                value: baai/bge-m3
              - name: AUDIO_COMPRESS_UPLOADS
                value: "true"
              - name: AUDIO_CODEC
                value: mp3
              - name: AUDIO_BITRATE
                value: 128k
              - name: ENABLE_SERVER_RECORDING_CHUNKS
                value: "true"
              - name: RECORDING_MAX_HOURS
                value: "4"
              - name: RECORDING_SESSION_TTL_HOURS
                value: "12"
              - name: RECORDING_SESSION_MAX_BYTES_PER_USER
                value: "1073741824"
              - name: RECORDING_SESSION_MAX_CHUNK_BYTES
                value: "16777216"
              - name: RECORDING_CHUNK_SECONDS
                value: "5"
              - name: RECORDING_SESSION_CLEANUP_INTERVAL_SECONDS
                value: "3600"
              - name: RECORDING_SESSION_COMMIT_BATCH_SIZE
                value: "1"
              - name: ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: speakr-secrets
                    key: ADMIN_PASSWORD
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: speakr-secrets
                    key: SECRET_KEY
              - name: TRANSCRIPTION_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: speakr-secrets
                    key: OPENROUTER_API_KEY
              - name: TEXT_MODEL_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: speakr-secrets
                    key: OPENROUTER_API_KEY
              - name: EMBEDDING_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: speakr-secrets
                    key: OPENROUTER_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8899
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 200m
                memory: 500Mi
              limits:
                cpu: 800m
                memory: 1Gi

    service:
      main:
        controller: main
        ports:
          http:
            port: *port
            protocol: TCP

    ingress:
      main:
        enabled: true
        className: "external"
        annotations:
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-body-size: "32m"
          nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.networking.svc.cluster.local/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://auth.${SECRET_DOMAIN}/oauth2/sign_in"
          external-dns/is-public: "true"
          external-dns.alpha.kubernetes.io/target: "ipv4.${SECRET_DOMAIN}"
        hosts:
          - host: &host "speakr.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: speakr-pvc
        globalMounts:
          - path: /data
