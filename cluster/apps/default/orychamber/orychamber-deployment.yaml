apiVersion: apps/v1
kind: Deployment
metadata:
  name: orychamber
  namespace: default
  labels:
    app.kubernetes.io/name: orychamber
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orychamber
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orychamber
        app.kubernetes.io/component: backend
      annotations:
        orychamber.home.arpa/binary-settings-revision: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
      # Preserve the workspace while allowing both application processes to shut down cleanly.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bootstrap
          # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/universal versioning=docker
          image: mcr.microsoft.com/devcontainers/universal:6.1.7-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -e
          args:
            - /opt/orychamber-bootstrap/bootstrap.sh
          env:
            - name: HOME
              value: /home/codespace
            - name: HOMEBREW_CACHE
              value: /tmp/Homebrew
            - name: XDG_CONFIG_HOME
              value: /home/codespace/.config
            - name: XDG_DATA_HOME
              value: /home/codespace/.local/share
            # renovate: datasource=npm depName=@opencode/cli
            - name: OPENCODE_VERSION
              value: "2.0.19"
            # renovate: datasource=npm depName=@openchamber/web
            - name: OPENCHAMBER_VERSION
              value: "2.0.4"
            # renovate: datasource=npm depName=agent-browser
            - name: AGENT_BROWSER_VERSION
              value: "0.38.1"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Keep bootstrap below the application's effective memory request.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: orychamber-data
              mountPath: /home/codespace
            - name: orychamber-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: orychamber-bootstrap
              mountPath: /opt/orychamber-bootstrap
              readOnly: true
        # Keep the loopback-only OpenCode service independent of OpenChamber's process lifecycle.
        - name: opencode-service
          restartPolicy: Always
          # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/universal versioning=docker
          image: mcr.microsoft.com/devcontainers/universal:6.1.7-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -e
            - /opt/orychamber-bootstrap/start-opencode-service.sh
          envFrom:
            - secretRef:
                name: orychamber-openchamber-secrets
            - configMapRef:
                name: orychamber-runtime-env
          workingDir: /home/codespace/workspaces
          # Gate OpenChamber startup on the local OpenCode service accepting connections.
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "const net=require('node:net'); const socket=net.createConnection({host:'127.0.0.1',port:4096}); const timer=setTimeout(()=>{socket.destroy();process.exit(1)},3000); socket.once('connect',()=>{clearTimeout(timer);socket.end();process.exit(0)}); socket.once('error',()=>{clearTimeout(timer);process.exit(1)});"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Bound server memory separately while retaining headroom for busy sessions.
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: orychamber-data
              mountPath: /home/codespace
            - name: orychamber-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: orychamber-bootstrap
              mountPath: /opt/orychamber-bootstrap
              readOnly: true
      containers:
        - name: openchamber
          # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/universal versioning=docker
          image: mcr.microsoft.com/devcontainers/universal:6.1.7-noble
          imagePullPolicy: IfNotPresent
          command:
            - /home/codespace/.npm-global/bin/openchamber
          args:
            - serve
            - --port
            - $(OPENCHAMBER_PORT)
            - --host
            - $(OPENCHAMBER_HOST)
            - --foreground
          env:
            - name: OPENCODE_HOST
              value: http://127.0.0.1:4096
            - name: OPENCODE_SKIP_START
              value: "true"
            - name: OPENCHAMBER_OPENCODE_CWD
              value: /home/codespace/workspaces
            - name: OPENCHAMBER_HOST
              value: 0.0.0.0
            - name: OPENCHAMBER_PORT
              value: "3000"
            - name: OPENCHAMBER_DATA_DIR
              value: /home/codespace/.config/openchamber
            - name: OPENCHAMBER_ALLOW_REMOTE_OPENAI_COMPAT_URLS
              value: "true"
          envFrom:
            - secretRef:
                name: orychamber-openchamber-secrets
            - configMapRef:
                name: orychamber-runtime-env
          workingDir: /home/codespace/workspaces
          ports:
            - name: openchamber
              containerPort: 3000
            - name: preview
              containerPort: 4173
          # Wait for OpenChamber to report a ready connection to the separate OpenCode service.
          startupProbe:
            exec:
              command:
                - node
                - /opt/orychamber-bootstrap/check-openchamber-health.js
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          # Confirm that the UI remains connected to the separate OpenCode service.
          readinessProbe:
            exec:
              command:
                - node
                - /opt/orychamber-bootstrap/check-openchamber-health.js
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          # Restart the container when the UI health endpoint stops responding.
          livenessProbe:
            httpGet:
              path: /health
              port: openchamber
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Budget the UI separately from the OpenCode service.
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              memory: 750Mi
          volumeMounts:
            - name: orychamber-data
              mountPath: /home/codespace
            - name: orychamber-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: orychamber-bootstrap
              mountPath: /opt/orychamber-bootstrap
              readOnly: true
      volumes:
        - name: orychamber-data
          persistentVolumeClaim:
            claimName: orychamber-data
        - name: orychamber-homebrew
          persistentVolumeClaim:
            claimName: orychamber-homebrew
        - name: tmp
          emptyDir: {}
        - name: orychamber-bootstrap
          configMap:
            name: orychamber-bootstrap
            defaultMode: 0555
