apiVersion: apps/v1
kind: Deployment
metadata:
  name: orychamber
  namespace: default
  labels:
    app.kubernetes.io/name: orychamber
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: orychamber
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orychamber
        app.kubernetes.io/component: backend
      annotations:
        orychamber.home.arpa/binary-settings-revision: "3"
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: k8-w5
      # Preserve the workspace while allowing both application processes to shut down cleanly.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bootstrap
          # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/universal versioning=docker
          image: mcr.microsoft.com/devcontainers/universal:6.1.12-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -e
          args:
            - /opt/orychamber-bootstrap/bootstrap.sh
          env:
            - name: HOME
              value: /home/codespace
            - name: HOMEBREW_CACHE
              value: /tmp/Homebrew
            - name: XDG_CONFIG_HOME
              value: /home/codespace/.config
            - name: XDG_DATA_HOME
              value: /home/codespace/.local/share
            # renovate: datasource=npm depName=@opencode/cli
            - name: OPENCODE_VERSION
              value: "2.2.6"
            # renovate: datasource=npm depName=@openchamber/web
            - name: OPENCHAMBER_VERSION
              value: "2.7.0"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Keep bootstrap below the application's effective memory request.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: orychamber-data
              mountPath: /home/codespace
            - name: orychamber-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: orychamber-bootstrap
              mountPath: /opt/orychamber-bootstrap
              readOnly: true
      containers:
        - name: openchamber
          # renovate: datasource=docker depName=mcr.microsoft.com/devcontainers/universal versioning=docker
          image: mcr.microsoft.com/devcontainers/universal:6.1.12-noble
          imagePullPolicy: IfNotPresent
          # Start OpenChamber directly so it manages its child and receives shutdown signals.
          command:
            - /home/codespace/.npm-global/bin/openchamber
          args:
            - serve
            - --port
            - $(OPENCHAMBER_PORT)
            - --host
            - $(OPENCHAMBER_HOST)
            - --foreground
          env:
            # Provide compute and headless graphics libraries to managed tool processes.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,graphics
            - name: OPENCODE_PORT
              value: "4096"
            - name: OPENCHAMBER_OPENCODE_HOSTNAME
              value: 127.0.0.1
            - name: OPENCODE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orychamber-openchamber-secrets
                  key: OPENCODE_SERVER_PASSWORD
            - name: OPENCHAMBER_OPENCODE_CWD
              value: /home/codespace/workspaces
            - name: OPENCHAMBER_HOST
              value: 0.0.0.0
            - name: OPENCHAMBER_PORT
              value: "3000"
            - name: OPENCHAMBER_DATA_DIR
              value: /home/codespace/.config/openchamber
            - name: OPENCHAMBER_ALLOW_REMOTE_OPENAI_COMPAT_URLS
              value: "true"
          envFrom:
            - secretRef:
                name: orychamber-openchamber-secrets
            - configMapRef:
                name: orychamber-runtime-env
          workingDir: /home/codespace/workspaces
          ports:
            - name: openchamber
              containerPort: 3000
            - name: preview
              containerPort: 4173
          # Wait for OpenChamber and its managed OpenCode child to become ready.
          startupProbe:
            exec:
              command:
                - node
                - /opt/orychamber-bootstrap/check-openchamber-health.js
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          # Confirm that the UI remains connected to its managed OpenCode child.
          readinessProbe:
            exec:
              command:
                - node
                - /opt/orychamber-bootstrap/check-openchamber-health.js
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
          # Restart both processes when the UI or its managed child cannot recover.
          livenessProbe:
            exec:
              command:
                - node
                - /opt/orychamber-bootstrap/check-openchamber-health.js
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Preserve the combined UI and OpenCode resource budget.
          resources:
            requests:
              cpu: 1250m
              memory: 4596Mi
              nvidia.com/gpu: 1
            limits:
              memory: 7918Mi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: orychamber-data
              mountPath: /home/codespace
            - name: orychamber-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: orychamber-bootstrap
              mountPath: /opt/orychamber-bootstrap
              readOnly: true
        - name: opencode-logs
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          # Follow the managed OpenCode log without replaying persisted entries.
          command:
            - tail
            - -n
            - "0"
            - -F
            - /var/log/opencode/opencode.log
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: orychamber-data
              mountPath: /var/log/opencode
              subPath: .local/share/opencode/log
              readOnly: true
      volumes:
        - name: orychamber-data
          persistentVolumeClaim:
            claimName: orychamber-data
        - name: orychamber-homebrew
          persistentVolumeClaim:
            claimName: orychamber-homebrew
        - name: tmp
          emptyDir: {}
        - name: orychamber-bootstrap
          configMap:
            name: orychamber-bootstrap
            defaultMode: 0555
