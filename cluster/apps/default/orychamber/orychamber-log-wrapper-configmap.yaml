apiVersion: v1
kind: ConfigMap
metadata:
  name: orychamber-opencode-log-wrapper
  namespace: default
data:
  opencode-wrapper: |
    #!/bin/sh
    # Keep the installed CLI as the execution target so this wrapper adds no process layer.
    set -eu
    opencode_binary=/home/codespace/.npm-global/bin/opencode

    # Keep stdout attached to OpenChamber because it detects the server listening line there.
    if [ "$#" -gt 0 ] && [ "$1" = serve ]; then
      # Send managed server logs to the container's inherited stderr stream.
      exec "$opencode_binary" "$@" --print-logs --log-level INFO 2>/proc/1/fd/2
    fi

    # Preserve version, help, and every non-server invocation unchanged.
    exec "$opencode_binary" "$@"
