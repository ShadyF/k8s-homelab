apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: opencode
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencode-workload-operations
  namespace: default
rules:
  # Allow exec through both GET WebSocket and POST transports.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Allow individual pod deletion; only owning controllers recreate pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Allow rolling restarts; RBAC cannot limit patches to restart annotations.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
---
# Bind workload operations only within the default namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencode-workload-operations
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opencode-workload-operations
subjects:
  - kind: ServiceAccount
    name: opencode
    namespace: default
---
# Allow OpenCode to send read-only queries through the Prometheus service proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencode-prometheus-query
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["kube-prometheus-stack-prometheus:9090"]
    verbs: ["get"]
---
# Bind the monitoring permission to the OpenCode service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencode-prometheus-query
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opencode-prometheus-query
subjects:
  - kind: ServiceAccount
    name: opencode
    namespace: default
