apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: opencode
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
      # Preserve the workspace while allowing the nested Docker engine to shut down cleanly.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bootstrap
          image: mcr.microsoft.com/devcontainers/universal:6.1.1-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -e
          args:
            - /opt/opencode-bootstrap/bootstrap.sh
          env:
            - name: HOME
              value: /home/node
            - name: HOMEBREW_CACHE
              value: /tmp/Homebrew
            - name: XDG_CONFIG_HOME
              value: /home/node/.config
            - name: XDG_DATA_HOME
              value: /home/node/.local/share
            # renovate: datasource=npm depName=opencode-ai
            - name: OPENCODE_VERSION
              value: "1.18.22"
            # renovate: datasource=npm depName=@openchamber/web
            - name: OPENCHAMBER_VERSION
              value: "1.20.0"
            # renovate: datasource=npm depName=agent-browser
            - name: AGENT_BROWSER_VERSION
              value: "0.34.0"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/node
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: docker-certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
            - name: bootstrap
              mountPath: /opt/opencode-bootstrap
              readOnly: true
      containers:
        - name: dind
          # renovate: datasource=docker depName=docker versioning=docker
          image: docker:29.7.2-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          # Set a default process ulimit for nested containers while preserving the DinD entrypoint's TLS setup.
          args:
            - --default-ulimit=nproc=256:256
          readinessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 1
              memory: 12Gi
              ephemeral-storage: 20Gi
            limits:
              memory: 16Gi
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-data
              mountPath: /var/lib/docker
            - name: opencode-data
              mountPath: /home/node/workspaces
              subPath: workspaces
        - name: openchamber
          image: mcr.microsoft.com/devcontainers/universal:6.1.1-noble
          imagePullPolicy: IfNotPresent
          command:
            - /home/node/.npm-global/bin/openchamber
          args:
            - serve
            - --port
            - $(OPENCHAMBER_PORT)
            - --host
            - $(OPENCHAMBER_HOST)
            - --foreground
          env:
            - name: HOME
              value: /home/node
            - name: XDG_CONFIG_HOME
              value: /home/node/.config
            - name: XDG_DATA_HOME
              value: /home/node/.local/share
            - name: PATH
              value: /home/node/.local/bin:/home/node/.npm-global/bin:/home/node/.local/share/pnpm:/home/linuxbrew/.linuxbrew/bin:/usr/local/share/nvm/current/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: NPM_CONFIG_PREFIX
              value: /home/node/.npm-global
            - name: PNPM_HOME
              value: /home/node/.local/share/pnpm
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_CONFIG
              value: /home/node/.config/docker
            - name: OPENCODE_BINARY
              value: /home/node/.npm-global/bin/opencode
            - name: OPENCODE_PORT
              value: "4096"
            - name: OPENCHAMBER_OPENCODE_HOSTNAME
              value: 127.0.0.1
            - name: OPENCHAMBER_OPENCODE_CWD
              value: /home/node/workspaces
            - name: OPENCHAMBER_HOST
              value: 0.0.0.0
            - name: OPENCHAMBER_PORT
              value: "3000"
            - name: OPENCHAMBER_DATA_DIR
              value: /home/node/.config/openchamber
            - name: OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS
              value: "true"
            - name: OPENCODE_ENABLE_EXA
              value: "true"
            - name: OPENCODE_PRINT_LOGS
              value: "1"
            - name: AGENT_BROWSER_CDP
              value: ws://browserless-chrome-svc.default.svc.cluster.local:3000/chrome
            - name: AGENT_BROWSER_CONTENT_BOUNDARIES
              value: "1"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
            - name: PLANNOTATOR_REMOTE
              value: "1"
            - name: PLANNOTATOR_PORT
              value: "19432"
            - name: PLANNOTATOR_SHARE
              value: disabled
          envFrom:
            - secretRef:
                name: opencode-openchamber-secrets
          workingDir: /home/node/workspaces
          ports:
            - name: openchamber
              containerPort: 3000
            - name: preview
              containerPort: 4173
            - name: plannotator
              containerPort: 19432
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/health', r => { let b=''; r.on('data', c => b += c); r.on('end', () => { try { const h=JSON.parse(b); process.exit(r.statusCode >= 200 && r.statusCode < 300 && h.openCodeRunning === true && h.isOpenCodeReady === true ? 0 : 1); } catch (_) { process.exit(1); } }); }).on('error', () => process.exit(1));"
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/health', r => { let b=''; r.on('data', c => b += c); r.on('end', () => { try { const h=JSON.parse(b); process.exit(r.statusCode >= 200 && r.statusCode < 300 && h.openCodeRunning === true && h.isOpenCodeReady === true ? 0 : 1); } catch (_) { process.exit(1); } }); }).on('error', () => process.exit(1));"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode >= 200 && r.statusCode < 300 ? 0 : 1)).on('error', () => process.exit(1));"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 1
              memory: 3Gi
            limits:
              memory: 5Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/node
            # Temporary compatibility aliases for pre-v1 home and workspace paths.
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-data
              mountPath: /home/opencode
            - name: opencode-data
              mountPath: /home/openchamber
              subPath: workspaces
            - name: opencode-data
              mountPath: /home/node/Programming
              subPath: workspaces/Programming
            - name: opencode-data
              mountPath: /home/node/Synapse
              subPath: workspaces/Synapse
            - name: opencode-data
              mountPath: /home/node/k8s-homelab
              subPath: workspaces/k8s-homelab
            - name: opencode-data
              mountPath: /workspaces
              subPath: workspaces
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: docker-certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
            - name: opencode-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-homebrew
          persistentVolumeClaim:
            claimName: opencode-homebrew
        # Share generated TLS material while exposing only the DinD client directory to OpenChamber.
        - name: docker-certs
          emptyDir:
            sizeLimit: 16Mi
        # Docker state is intentionally disposable and bounded to the Pod's ephemeral storage.
        - name: docker-data
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir: {}
        - name: opencode-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: bootstrap
          configMap:
            name: opencode-bootstrap
            defaultMode: 0555
