apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: opencode
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: bootstrap-and-migrate
          image: mcr.microsoft.com/devcontainers/universal:6.1.1-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -o pipefail

              export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
              if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
                NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              fi
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
              if ! brew list --formula kubernetes-cli >/dev/null 2>&1; then
                brew install kubernetes-cli
              fi
              test -x "$(command -v brew)"
              test -x "$(command -v kubectl)"

              migration_marker="$HOME/.opencode-home-migration-v1.complete"
              legacy_opencode=/legacy/opencode-config
              legacy_openchamber=/legacy/openchamber-config

              path_exists() {
                [ -e "$1" ] || [ -L "$1" ]
              }

              fail_preflight() {
                printf 'migration preflight failed: %s\n' "$1" >&2
                exit 1
              }

              require_source_directory() {
                [ -d "$1" ] || fail_preflight "required source directory missing: $1"
              }

              preflight_same_path() {
                source_path="$1"
                destination_path="$2"
                path_exists "$destination_path" || return 0
                if [ -L "$source_path" ] || [ -L "$destination_path" ]; then
                  [ -L "$source_path" ] && [ -L "$destination_path" ] \
                    || fail_preflight "path type differs: $destination_path"
                  [ "$(readlink -- "$source_path")" = "$(readlink -- "$destination_path")" ] \
                    || fail_preflight "path differs: $destination_path"
                elif [ -d "$source_path" ] && [ -d "$destination_path" ]; then
                  return 0
                elif [ -f "$source_path" ] && [ -f "$destination_path" ]; then
                  cmp -s -- "$source_path" "$destination_path" || fail_preflight "path differs: $destination_path"
                else
                  fail_preflight "path type differs: $destination_path"
                fi
              }

              preflight_strict_merge() {
                source_path="$1"
                destination_path="$2"
                path_exists "$source_path" || return 0
                if [ -d "$source_path" ]; then
                  if path_exists "$destination_path" && [ ! -d "$destination_path" ]; then
                    fail_preflight "path type differs: $destination_path"
                  fi
                  while IFS= read -r -d '' child_source; do
                    child_destination="$destination_path/$${child_source#"$source_path"/}"
                    preflight_same_path "$child_source" "$child_destination"
                  done < <(find "$source_path" -mindepth 1 -print0)
                else
                  preflight_same_path "$source_path" "$destination_path"
                fi
              }

              apply_strict_merge() {
                source_path="$1"
                destination_path="$2"
                path_exists "$source_path" || return 0
                if [ -d "$source_path" ]; then
                  mkdir -p -- "$destination_path"
                  while IFS= read -r -d '' child_source; do
                    child_destination="$destination_path/$${child_source#"$source_path"/}"
                    if ! path_exists "$child_destination"; then
                      mkdir -p -- "$(dirname -- "$child_destination")"
                      cp -a -- "$child_source" "$child_destination"
                    fi
                  done < <(find "$source_path" -mindepth 1 -print0)
                elif ! path_exists "$destination_path"; then
                  mkdir -p -- "$(dirname -- "$destination_path")"
                  cp -a -- "$source_path" "$destination_path"
                fi
              }

              merge_missing() {
                source_path="$1"
                destination_path="$2"
                path_exists "$source_path" || return 0
                if [ -d "$source_path" ]; then
                  mkdir -p -- "$destination_path"
                  while IFS= read -r -d '' child_source; do
                    child_destination="$destination_path/$${child_source#"$source_path"/}"
                    if ! path_exists "$child_destination"; then
                      mkdir -p -- "$(dirname -- "$child_destination")"
                      cp -a -- "$child_source" "$child_destination"
                    fi
                  done < <(find "$source_path" -mindepth 1 -print0)
                elif ! path_exists "$destination_path"; then
                  mkdir -p -- "$(dirname -- "$destination_path")"
                  cp -a -- "$source_path" "$destination_path"
                fi
              }

              if [ ! -f "$migration_marker" ]; then
                # Verify every source and conflict before changing canonical state.
                require_source_directory "$legacy_opencode/opencode"
                require_source_directory "$legacy_openchamber/.config/openchamber"
                require_source_directory "$legacy_openchamber/.ssh"
                preflight_strict_merge "$legacy_openchamber/Programming" "$HOME/workspaces/Programming"
                preflight_strict_merge "$legacy_openchamber/Synapse" "$HOME/workspaces/Synapse"
                preflight_strict_merge "$legacy_openchamber/k8s-homelab" "$HOME/workspaces/k8s-homelab"
                preflight_strict_merge "$legacy_openchamber/.local/share/opencode" "$HOME/.local/share/opencode"
                preflight_strict_merge "$legacy_openchamber/.gitconfig" "$HOME/.gitconfig"
                preflight_strict_merge "$legacy_openchamber/.git-credentials" "$HOME/.git-credentials"
                preflight_strict_merge "$legacy_openchamber/.config/git" "$HOME/.config/git"
                preflight_strict_merge "$legacy_openchamber/.config/gh" "$HOME/.config/gh"

                stage_root="$(mktemp -d "$HOME/.opencode-migration-v1.stage.XXXXXX")"
                trap 'rm -rf -- "$stage_root"' EXIT
                cp -a -- "$legacy_opencode/opencode" "$stage_root/opencode"
                cp -a -- "$legacy_openchamber/.config/openchamber" "$stage_root/openchamber"
                cp -a -- "$legacy_openchamber/.ssh" "$stage_root/ssh"

                # Promote staged authoritative state only after all conflict checks pass.
                mkdir -p -- "$HOME/.config" "$HOME/.local/share" "$HOME/workspaces"
                rm -rf -- "$HOME/.config/opencode" "$HOME/.config/openchamber" "$HOME/.ssh"
                mv -- "$stage_root/opencode" "$HOME/.config/opencode"
                mv -- "$stage_root/openchamber" "$HOME/.config/openchamber"
                mv -- "$stage_root/ssh" "$HOME/.ssh"

                # Strict merges preserve both source-only and destination-only state.
                apply_strict_merge "$legacy_openchamber/Programming" "$HOME/workspaces/Programming"
                apply_strict_merge "$legacy_openchamber/Synapse" "$HOME/workspaces/Synapse"
                apply_strict_merge "$legacy_openchamber/k8s-homelab" "$HOME/workspaces/k8s-homelab"
                apply_strict_merge "$legacy_openchamber/.local/share/opencode" "$HOME/.local/share/opencode"
                apply_strict_merge "$legacy_openchamber/.gitconfig" "$HOME/.gitconfig"
                apply_strict_merge "$legacy_openchamber/.git-credentials" "$HOME/.git-credentials"
                apply_strict_merge "$legacy_openchamber/.config/git" "$HOME/.config/git"
                apply_strict_merge "$legacy_openchamber/.config/gh" "$HOME/.config/gh"
                mkdir -p "$HOME/workspaces/Programming" "$HOME/workspaces/Synapse" "$HOME/workspaces/k8s-homelab"

                # The destination is the OpenCode-side authority for pnpm configuration.
                merge_missing "$legacy_opencode/.npmrc" "$HOME/.npmrc"
                merge_missing "$legacy_openchamber/.npmrc" "$HOME/.npmrc"
                merge_missing "$legacy_opencode/pnpm" "$HOME/.config/pnpm"
                merge_missing "$legacy_openchamber/.config/pnpm" "$HOME/.config/pnpm"

                # Do not copy legacy npm caches, globals, or version markers.  Existing .agents is retained.
                rm -rf -- "$stage_root"
                trap - EXIT
                touch "$migration_marker"
              fi

              export NPM_CONFIG_PREFIX="$HOME/.npm-global"
              export npm_config_cache="$HOME/.npm"
              export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
              mkdir -p "$NPM_CONFIG_PREFIX" "$npm_config_cache" "$HOME/.agents/skills/agent-browser" "$AGENT_BROWSER_SOCKET_DIR"

              package_is_pinned() {
                package_name="$1"
                package_version="$2"
                executable_name="$3"
                [ -x "$NPM_CONFIG_PREFIX/bin/$executable_name" ] || return 1
                node -e 'try { process.exit(require(process.argv[1]).version === process.argv[2] ? 0 : 1); } catch (_) { process.exit(1); }' \
                  "$NPM_CONFIG_PREFIX/lib/node_modules/$package_name/package.json" "$package_version"
              }

              if ! package_is_pinned opencode-ai "$OPENCODE_VERSION" opencode; then
                npm install --global "opencode-ai@$OPENCODE_VERSION"
              fi
              if ! package_is_pinned @openchamber/web "$OPENCHAMBER_VERSION" openchamber; then
                npm install --global "@openchamber/web@$OPENCHAMBER_VERSION"
              fi
              if ! package_is_pinned agent-browser "$AGENT_BROWSER_VERSION" agent-browser; then
                npm install --global "agent-browser@$AGENT_BROWSER_VERSION"
              fi
              test -x "$NPM_CONFIG_PREFIX/bin/opencode"
              test -x "$NPM_CONFIG_PREFIX/bin/openchamber"
              test -x "$NPM_CONFIG_PREFIX/bin/agent-browser"

              skill_file="$HOME/.agents/skills/agent-browser/SKILL.md"
              skill_revision="v$AGENT_BROWSER_VERSION"
              skill_revision_marker="$HOME/.agent-browser-skill-revision"
              if [ ! -s "$skill_file" ] \
                || [ "$(cat "$skill_revision_marker" 2>/dev/null || true)" != "$skill_revision" ] \
                || ! grep -Fq -- '## OpenCode cluster environment' "$skill_file"; then
                curl --fail --silent --show-error --location \
                  "https://raw.githubusercontent.com/vercel-labs/agent-browser/$skill_revision/skills/agent-browser/SKILL.md" \
                  --output "$skill_file.tmp"
                test -s "$skill_file.tmp"
                cat >> "$skill_file.tmp" <<'EOF'

              ## OpenCode cluster environment

              - Chromium is remote; do not run `agent-browser install`.
              - Start project preview servers on `0.0.0.0:4173`.
              - Browse previews at `http://opencode.default.svc.cluster.local:4173`, not localhost.
              - Close browser sessions after verification.
              EOF
                mv "$skill_file.tmp" "$skill_file"
                printf '%s\n' "$skill_revision" > "$skill_revision_marker"
              fi
          env:
            - name: HOME
              value: /home/node
            - name: HOMEBREW_CACHE
              value: /tmp/Homebrew
            - name: XDG_CONFIG_HOME
              value: /home/node/.config
            - name: XDG_DATA_HOME
              value: /home/node/.local/share
            # renovate: datasource=npm depName=opencode-ai
            - name: OPENCODE_VERSION
              value: "1.18.18"
            # renovate: datasource=npm depName=@openchamber/web
            - name: OPENCHAMBER_VERSION
              value: "1.18.4"
            # renovate: datasource=npm depName=agent-browser
            - name: AGENT_BROWSER_VERSION
              value: "0.34.0"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/node
            - name: opencode-config
              mountPath: /legacy/opencode-config
              readOnly: true
            - name: openchamber-config
              mountPath: /legacy/openchamber-config
              readOnly: true
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openchamber
          image: mcr.microsoft.com/devcontainers/universal:6.1.1-noble
          imagePullPolicy: IfNotPresent
          command:
            - /home/node/.npm-global/bin/openchamber
          args:
            - serve
            - --port
            - $(OPENCHAMBER_PORT)
            - --host
            - $(OPENCHAMBER_HOST)
            - --foreground
          env:
            - name: HOME
              value: /home/node
            - name: XDG_CONFIG_HOME
              value: /home/node/.config
            - name: XDG_DATA_HOME
              value: /home/node/.local/share
            - name: PATH
              value: /home/node/.npm-global/bin:/home/node/.local/share/pnpm:/home/linuxbrew/.linuxbrew/bin:/usr/local/share/nvm/current/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: NPM_CONFIG_PREFIX
              value: /home/node/.npm-global
            - name: PNPM_HOME
              value: /home/node/.local/share/pnpm
            - name: OPENCODE_BINARY
              value: /home/node/.npm-global/bin/opencode
            - name: OPENCODE_PORT
              value: "4096"
            - name: OPENCHAMBER_OPENCODE_HOSTNAME
              value: 127.0.0.1
            - name: OPENCHAMBER_OPENCODE_CWD
              value: /home/node/workspaces
            - name: OPENCHAMBER_HOST
              value: 0.0.0.0
            - name: OPENCHAMBER_PORT
              value: "3000"
            - name: OPENCHAMBER_DATA_DIR
              value: /home/node/.config/openchamber
            - name: OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS
              value: "true"
            - name: OPENCODE_ENABLE_EXA
              value: "true"
            - name: OPENCODE_PRINT_LOGS
              value: "1"
            - name: AGENT_BROWSER_CDP
              value: ws://browserless-chrome-svc.default.svc.cluster.local:3000/chrome
            - name: AGENT_BROWSER_CONTENT_BOUNDARIES
              value: "1"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
            - name: PLANNOTATOR_REMOTE
              value: "1"
            - name: PLANNOTATOR_PORT
              value: "19432"
            - name: PLANNOTATOR_SHARE
              value: disabled
          envFrom:
            - secretRef:
                name: opencode-openchamber-secrets
          workingDir: /home/node/workspaces
          ports:
            - name: openchamber
              containerPort: 3000
            - name: preview
              containerPort: 4173
            - name: plannotator
              containerPort: 19432
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/health', r => { let b=''; r.on('data', c => b += c); r.on('end', () => { try { const h=JSON.parse(b); process.exit(r.statusCode >= 200 && r.statusCode < 300 && h.openCodeRunning === true && h.isOpenCodeReady === true ? 0 : 1); } catch (_) { process.exit(1); } }); }).on('error', () => process.exit(1));"
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/health', r => { let b=''; r.on('data', c => b += c); r.on('end', () => { try { const h=JSON.parse(b); process.exit(r.statusCode >= 200 && r.statusCode < 300 && h.openCodeRunning === true && h.isOpenCodeReady === true ? 0 : 1); } catch (_) { process.exit(1); } }); }).on('error', () => process.exit(1));"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode >= 200 && r.statusCode < 300 ? 0 : 1)).on('error', () => process.exit(1));"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 700m
              memory: 3Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/node
            # Temporary compatibility aliases for pre-v1 home and workspace paths.
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-data
              mountPath: /home/opencode
            - name: opencode-data
              mountPath: /home/openchamber
              subPath: workspaces
            - name: opencode-data
              mountPath: /home/node/Programming
              subPath: workspaces/Programming
            - name: opencode-data
              mountPath: /home/node/Synapse
              subPath: workspaces/Synapse
            - name: opencode-data
              mountPath: /home/node/k8s-homelab
              subPath: workspaces/k8s-homelab
            - name: opencode-data
              mountPath: /workspaces
              subPath: workspaces
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: opencode-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: opencode-config
          persistentVolumeClaim:
            claimName: opencode-config
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-homebrew
          persistentVolumeClaim:
            claimName: opencode-homebrew
        - name: openchamber-config
          persistentVolumeClaim:
            claimName: openchamber-config
        - name: tmp
          emptyDir: {}
        - name: opencode-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
