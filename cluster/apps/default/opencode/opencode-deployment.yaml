apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        opencode.home.arpa/bootstrap-revision: "1"
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: opencode
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      nodeSelector:
        kubernetes.io/arch: amd64
      # Preserve the workspace while allowing the nested Docker engine to shut down cleanly.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bootstrap
          image: mcr.microsoft.com/devcontainers/universal:6.1.14-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -e
          args:
            - /opt/opencode-bootstrap/bootstrap.sh
          env:
            - name: HOME
              value: /home/codespace
            - name: HOMEBREW_CACHE
              value: /tmp/Homebrew
            - name: XDG_CONFIG_HOME
              value: /home/codespace/.config
            - name: XDG_DATA_HOME
              value: /home/codespace/.local/share
            # renovate: datasource=npm depName=@opencode/cli
            - name: OPENCODE_VERSION
              value: "2.3.0"
            # renovate: datasource=npm depName=@openchamber/web
            - name: OPENCHAMBER_VERSION
              value: "2.7.1"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: docker-certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
            - name: bootstrap
              mountPath: /opt/opencode-bootstrap
              readOnly: true
        # Keep the Docker daemon available for the pod lifetime and block app startup until TLS is ready.
        - name: dind
          restartPolicy: Always
          # renovate: datasource=docker depName=docker versioning=docker
          image: docker:29.9.3-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          # Allow concurrent nested development workloads while retaining a process ceiling.
          args:
            - --default-ulimit=nproc=4096:4096
            # Match default and newly created Docker bridges to the pod network MTU.
            - --mtu=1450
            - --default-network-opt=bridge=com.docker.network.driver.mtu=1450
          readinessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          startupProbe:
            exec:
              command:
                - docker
                - info
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          # Reserve typical build usage while allowing short Docker workload bursts.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 3Gi
              ephemeral-storage: 5Gi
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-data
              mountPath: /var/lib/docker
            - name: opencode-data
              mountPath: /home/codespace/workspaces
              subPath: workspaces
            - name: opencode-data
              mountPath: /home/codespace/.local/share/opencode/worktree
              subPath: .local/share/opencode/worktree
      containers:
        - name: openchamber
          image: mcr.microsoft.com/devcontainers/universal:6.1.14-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -e
            - /opt/opencode-bootstrap/start-openchamber.sh
            - serve
            - --port
            - "3000"
            - --host
            - 0.0.0.0
            - --foreground
          env:
            - name: OPENCODE_PORT
              value: "4096"
            - name: OPENCHAMBER_OPENCODE_HOSTNAME
              value: "127.0.0.1"
            - name: OPENCODE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-openchamber-secrets
                  key: OPENCODE_SERVER_PASSWORD
            - name: OPENCHAMBER_ALLOW_REMOTE_OPENAI_COMPAT_URLS
              value: "true"
          envFrom:
            - secretRef:
                name: opencode-openchamber-secrets
            - configMapRef:
                name: opencode-runtime-env
          workingDir: /home/codespace/workspaces
          ports:
            - name: openchamber
              containerPort: 3000
            - name: preview
              containerPort: 4173
          startupProbe:
            exec:
              command:
                - node
                - /opt/opencode-bootstrap/check-openchamber-health.js
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - /opt/opencode-bootstrap/check-openchamber-health.js
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - /opt/opencode-bootstrap/check-openchamber-health.js
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Reserve the combined OpenChamber and managed OpenCode service budget.
          resources:
            requests:
              cpu: 1250m
              memory: 6744Mi
            limits:
              memory: 11.1Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: docker-certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
            - name: bootstrap
              mountPath: /opt/opencode-bootstrap
              readOnly: true
            - name: opencode-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        # Forward OpenCode logs to container output with read-only access to only the log directory.
        - name: opencode-logs
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - tail
          args:
            - -n
            - "0"
            - -F
            - /var/log/opencode/opencode.log
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: opencode-data
              mountPath: /var/log/opencode
              subPath: .local/share/opencode/log
              readOnly: true
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-homebrew
          persistentVolumeClaim:
            claimName: opencode-homebrew
        # Share generated TLS material with the app container through the client directory.
        - name: docker-certs
          emptyDir:
            sizeLimit: 16Mi
        # Preserve Docker state across pod restarts with dedicated storage.
        - name: docker-data
          persistentVolumeClaim:
            claimName: opencode-docker-data
        - name: tmp
          emptyDir: {}
        - name: opencode-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: bootstrap
          configMap:
            name: opencode-bootstrap
            defaultMode: 0555
