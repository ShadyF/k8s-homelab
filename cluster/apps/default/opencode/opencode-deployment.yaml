apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: opencode
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      nodeSelector:
        kubernetes.io/arch: amd64
      # Preserve the workspace while allowing the nested Docker engine to shut down cleanly.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bootstrap
          image: mcr.microsoft.com/devcontainers/universal:6.1.10-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -e
          args:
            - /opt/opencode-bootstrap/bootstrap.sh
          env:
            - name: HOME
              value: /home/codespace
            - name: HOMEBREW_CACHE
              value: /tmp/Homebrew
            - name: XDG_CONFIG_HOME
              value: /home/codespace/.config
            - name: XDG_DATA_HOME
              value: /home/codespace/.local/share
            # renovate: datasource=npm depName=@opencode/cli
            - name: OPENCODE_VERSION
              value: "2.0.26"
            # renovate: datasource=npm depName=@openchamber/web
            - name: OPENCHAMBER_VERSION
              value: "2.2.0"
            # renovate: datasource=npm depName=agent-browser
            - name: AGENT_BROWSER_VERSION
              value: "0.38.2"
            - name: AGENT_BROWSER_SOCKET_DIR
              value: /tmp/agent-browser
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: docker-certs
              mountPath: /certs
            - name: tmp
              mountPath: /tmp
            - name: bootstrap
              mountPath: /opt/opencode-bootstrap
              readOnly: true
        # Keep the Docker daemon available for the pod lifetime and block app startup until TLS is ready.
        - name: dind
          restartPolicy: Always
          # renovate: datasource=docker depName=docker versioning=docker
          image: docker:29.8.2-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
          # Allow concurrent nested development workloads while retaining a process ceiling.
          args:
            - --default-ulimit=nproc=4096:4096
          readinessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          startupProbe:
            exec:
              command:
                - docker
                - info
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          # Reserve typical build usage while allowing short Docker workload bursts.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 3Gi
              ephemeral-storage: 5Gi
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-data
              mountPath: /var/lib/docker
            - name: opencode-data
              mountPath: /home/codespace/workspaces
              subPath: workspaces
            - name: opencode-data
              mountPath: /home/codespace/.local/share/opencode/worktree
              subPath: .local/share/opencode/worktree
        # Keep the authenticated OpenCode service independent of OpenChamber's process lifecycle.
        - name: opencode-service
          restartPolicy: Always
          image: mcr.microsoft.com/devcontainers/universal:6.1.10-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -e
            - /opt/opencode-bootstrap/start-opencode-service.sh
          envFrom:
            - secretRef:
                name: opencode-openchamber-secrets
            - configMapRef:
                name: opencode-runtime-env
          workingDir: /home/codespace/workspaces
          # Gate OpenChamber startup with an in-container check of the loopback-only service.
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "const net=require('node:net'); const socket=net.createConnection({host:'127.0.0.1',port:4096}); const timer=setTimeout(()=>{socket.destroy();process.exit(1)},3000); socket.once('connect',()=>{clearTimeout(timer);socket.end();process.exit(0)}); socket.once('error',()=>{clearTimeout(timer);process.exit(1)});"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Bound server memory separately and watch its peak during busy sessions.
          resources:
            requests:
              cpu: 1
              memory: 5Gi
            limits:
              memory: 9Gi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: docker-certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
            - name: bootstrap
              mountPath: /opt/opencode-bootstrap
              readOnly: true
            - name: opencode-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      containers:
        - name: openchamber
          image: mcr.microsoft.com/devcontainers/universal:6.1.10-noble
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -e
            - /opt/opencode-bootstrap/start-openchamber.sh
            - serve
            - --port
            - "3000"
            - --host
            - 0.0.0.0
            - --foreground
          env:
            - name: OPENCODE_HOST
              value: http://127.0.0.1:4096
            - name: OPENCODE_SKIP_START
              value: "true"
            - name: OPENCHAMBER_ALLOW_REMOTE_OPENAI_COMPAT_URLS
              value: "true"
          envFrom:
            - secretRef:
                name: opencode-openchamber-secrets
            - configMapRef:
                name: opencode-runtime-env
          workingDir: /home/codespace/workspaces
          ports:
            - name: openchamber
              containerPort: 3000
            - name: preview
              containerPort: 4173
          startupProbe:
            exec:
              command:
                - node
                - /opt/opencode-bootstrap/check-openchamber-health.js
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - node
                - /opt/opencode-bootstrap/check-openchamber-health.js
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: openchamber
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Start the separate UI budget conservatively; its post-split peak still needs observation.
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              memory: 800Mi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/codespace
            - name: opencode-homebrew
              mountPath: /home/linuxbrew
            - name: tmp
              mountPath: /tmp
            - name: docker-certs
              mountPath: /certs/client
              subPath: client
              readOnly: true
            - name: bootstrap
              mountPath: /opt/opencode-bootstrap
              readOnly: true
            - name: opencode-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
        - name: opencode-homebrew
          persistentVolumeClaim:
            claimName: opencode-homebrew
        # Share generated TLS material with both app containers through the client directory.
        - name: docker-certs
          emptyDir:
            sizeLimit: 16Mi
        # Preserve Docker state across pod restarts with dedicated storage.
        - name: docker-data
          persistentVolumeClaim:
            claimName: opencode-docker-data
        - name: tmp
          emptyDir: {}
        - name: opencode-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: bootstrap
          configMap:
            name: opencode-bootstrap
            defaultMode: 0555
