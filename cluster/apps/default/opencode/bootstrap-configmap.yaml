apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-bootstrap
  namespace: default
data:
  bootstrap.sh: |
    set -o pipefail

    export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"

    # Create the OpenCode log directory before Kubernetes starts the log sidecar.
    mkdir -p "$HOME/.local/share/opencode/log"

    if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
      NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    fi
    eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
    if ! brew list --formula kubernetes-cli >/dev/null 2>&1; then
      brew install kubernetes-cli
    fi
    test -x "$(command -v brew)"
    test -x "$(command -v kubectl)"

    # Install only missing Docker client formulas; Homebrew retains their state across restarts.
    for formula in docker docker-compose docker-buildx; do
      if ! brew list --formula "$formula" >/dev/null 2>&1; then
        brew install "$formula"
      fi
    done

    docker_cli_path="$(command -v docker)"
    docker_config_dir="$HOME/.config/docker"
    export DOCKER_CONFIG="$docker_config_dir"
    docker_plugin_dir="/home/linuxbrew/.linuxbrew/lib/docker/cli-plugins"
    docker_user_plugin_dir="$DOCKER_CONFIG/cli-plugins"
    mkdir -p "$docker_user_plugin_dir"
    test -x "$docker_cli_path"

    # Point Docker's native plugin directory at Homebrew's fixed plugin locations.
    for plugin_name in docker-compose docker-buildx; do
      plugin_target="$docker_plugin_dir/$plugin_name"
      plugin_link="$docker_user_plugin_dir/$plugin_name"
      test -x "$plugin_target" || { printf 'Docker plugin is missing or not executable: %s\n' "$plugin_target" >&2; exit 1; }
      if [ -L "$plugin_link" ]; then
        existing_target="$(readlink "$plugin_link")"
        case "$existing_target" in
          "$plugin_target"|/home/linuxbrew/.linuxbrew/*/docker/cli-plugins/"$plugin_name"|/home/linuxbrew/.linuxbrew/*/libexec/docker/cli-plugins/"$plugin_name"|/home/linuxbrew/.linuxbrew/Cellar/*/bin/"$plugin_name") ;;
          *) printf 'Refusing to replace unexpected Docker plugin link: %s -> %s\n' "$plugin_link" "$existing_target" >&2; exit 1 ;;
        esac
        if [ "$existing_target" != "$plugin_target" ]; then
          rm "$plugin_link"
          ln -s "$plugin_target" "$plugin_link"
        fi
      elif [ -e "$plugin_link" ]; then
        printf 'Refusing to replace unexpected Docker plugin file: %s\n' "$plugin_link" >&2
        exit 1
      else
        ln -s "$plugin_target" "$plugin_link"
      fi
    done

    # Check Docker and plugin command versions without contacting the DinD daemon.
    "$docker_cli_path" --version >/dev/null
    "$docker_cli_path" compose version --short >/dev/null
    "$docker_cli_path" buildx version >/dev/null

    # Remove only the known persisted wait wrapper, then keep Homebrew Docker first on PATH.
    old_docker_wrapper="$HOME/.local/bin/docker"
    if [ -f "$old_docker_wrapper" ] && grep -Fq 'docker_cli=/home/linuxbrew/.linuxbrew/bin/docker' "$old_docker_wrapper" \
      && grep -Fq 'retry after the DinD sidecar is ready.' "$old_docker_wrapper"; then
      rm -f "$old_docker_wrapper"
    fi
    export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
    test "$(command -v docker)" = "$docker_cli_path"

    export NPM_CONFIG_PREFIX="$HOME/.npm-global"
    export npm_config_cache="$HOME/.npm"
    export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
    # Create app-user paths before Kubernetes prepares DinD's worktree subPath mount.
    mkdir -p "$NPM_CONFIG_PREFIX" "$npm_config_cache" "$HOME/.agents/skills/agent-browser" "$AGENT_BROWSER_SOCKET_DIR" "$HOME/.local/share/opencode/worktree"

    package_is_pinned() {
      package_name="$1"
      package_version="$2"
      executable_name="$3"
      [ -x "$NPM_CONFIG_PREFIX/bin/$executable_name" ] || return 1
      node -e 'try { process.exit(require(process.argv[1]).version === process.argv[2] ? 0 : 1); } catch (_) { process.exit(1); }' \
        "$NPM_CONFIG_PREFIX/lib/node_modules/$package_name/package.json" "$package_version"
    }

    # Install the pinned OpenCode, OpenChamber, and agent-browser packages.
    if ! package_is_pinned @opencode/cli "$OPENCODE_VERSION" opencode; then
      npm install --global "@opencode/cli@$OPENCODE_VERSION"
    fi
    if ! package_is_pinned @openchamber/web "$OPENCHAMBER_VERSION" openchamber; then
      npm install --global "@openchamber/web@$OPENCHAMBER_VERSION"
    fi
    if ! package_is_pinned agent-browser "$AGENT_BROWSER_VERSION" agent-browser; then
      npm install --global "agent-browser@$AGENT_BROWSER_VERSION"
    fi
    test -x "$NPM_CONFIG_PREFIX/bin/opencode"
    test -x "$NPM_CONFIG_PREFIX/bin/openchamber"
    test -x "$NPM_CONFIG_PREFIX/bin/agent-browser"

    # Clear only the persisted binary override so the Deployment environment owns selection.
    opencode_settings_dir="$${OPENCHAMBER_DATA_DIR:-$HOME/.config/openchamber}"
    opencode_settings_file="$opencode_settings_dir/settings.json"
    node - "$opencode_settings_file" <<'NODE'
    const fs = require('node:fs');
    const path = require('node:path');

    const settingsFile = process.argv[2];
    const settingsDir = path.dirname(settingsFile);
    let settings = {};
    let fileMode = 0o600;

    // Read and validate before creating a replacement so malformed settings are never overwritten.
    try {
      const stat = fs.statSync(settingsFile);
      if (!stat.isFile()) {
        throw new Error('settings path is not a regular file');
      }
      fileMode = stat.mode & 0o7777;
      settings = JSON.parse(fs.readFileSync(settingsFile, 'utf8'));
    } catch (error) {
      if (error?.code !== 'ENOENT') {
        process.stderr.write(error instanceof SyntaxError
          ? 'OpenChamber settings JSON is malformed; refusing to overwrite it.\n'
          : 'OpenChamber settings could not be read; refusing to overwrite it.\n');
        process.exit(1);
      }
      process.exit(0);
    }

    // Keep every setting and add the empty sentinel used to clear the binary override.
    if (!settings || typeof settings !== 'object' || Array.isArray(settings)) {
      process.stderr.write('OpenChamber settings must contain a JSON object; refusing to overwrite it.\n');
      process.exit(1);
    }
    if (settings.opencodeBinary === undefined || settings.opencodeBinary === '') process.exit(0);
    settings.opencodeBinary = '';

    // Replace the file in one same-directory rename while retaining restrictive permissions.
    fs.mkdirSync(settingsDir, { recursive: true, mode: 0o700 });
    const temporaryFile = path.join(
      settingsDir,
      '.settings.json.bootstrap-' + process.pid + '-' + Date.now(),
    );
    try {
      const descriptor = fs.openSync(temporaryFile, 'wx', fileMode);
      try {
        fs.writeFileSync(descriptor, JSON.stringify(settings, null, 2) + '\n', 'utf8');
        fs.fsyncSync(descriptor);
      } finally {
        fs.closeSync(descriptor);
      }
      fs.chmodSync(temporaryFile, fileMode);
      fs.renameSync(temporaryFile, settingsFile);
      const directoryDescriptor = fs.openSync(settingsDir, 'r');
      try {
        fs.fsyncSync(directoryDescriptor);
      } finally {
        fs.closeSync(directoryDescriptor);
      }
    } catch (error) {
      fs.rmSync(temporaryFile, { force: true });
      process.stderr.write('OpenChamber settings could not be updated atomically.\n');
      process.exit(1);
    }
    NODE

    skill_file="$HOME/.agents/skills/agent-browser/SKILL.md"
    skill_revision="v$AGENT_BROWSER_VERSION"
    skill_revision_marker="$HOME/.agent-browser-skill-revision"
    skill_marker_value="$skill_revision-worktree-paths"
    if [ ! -s "$skill_file" ] \
      || [ "$(cat "$skill_revision_marker" 2>/dev/null || true)" != "$skill_marker_value" ] \
      || ! grep -Fq -- '## OpenCode cluster environment' "$skill_file"; then
      curl --fail --silent --show-error --location \
        "https://raw.githubusercontent.com/vercel-labs/agent-browser/$skill_revision/skills/agent-browser/SKILL.md" \
        --output "$skill_file.tmp"
      test -s "$skill_file.tmp"
      cat >> "$skill_file.tmp" <<'EOF'

    ## OpenCode cluster environment

    - Chromium is remote; do not run `agent-browser install`.
    - Start project preview servers on `0.0.0.0:4173`.
    - Browse previews at `http://opencode.default.svc.cluster.local:4173`, not localhost.
    - Close browser sessions after verification.
    - Run Docker and Compose from repositories under `/home/codespace/workspaces` or native OpenCode worktrees under
      `/home/codespace/.local/share/opencode/worktree`; both paths are mounted into DinD at the same absolute paths.
    - Treat Dockerfiles and Compose files as executable code; inspect privileged mounts, published ports, and network access first.
    - Set a unique `COMPOSE_PROJECT_NAME` when workspaces or sessions can overlap.
    - Prefer project-provided Docker and Compose commands unchanged and wait on health checks instead of fixed sleeps.
    - Capture container logs and browser artifacts before tearing down failed test environments.
    - Use `docker compose down --volumes --remove-orphans` for project-scoped cleanup; keep global cleanup confirmation-gated.
    - Normal Docker and Compose inspection/lifecycle commands are allowed; request confirmation for destructive global cleanup.
    - Do not use `--privileged`, host-like mounts, or broad network exposure unless explicitly required and approved.
    - The DinD TLS API has no Service or Ingress but is reachable through the Pod IP; never treat port 2376 as unauthenticated or expose it further.
    EOF
      mv "$skill_file.tmp" "$skill_file"
      printf '%s\n' "$skill_marker_value" > "$skill_revision_marker"
    fi
