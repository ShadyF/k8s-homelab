apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-docker-data
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: docker-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: opencode-docker
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-homebrew
  namespace: default
  labels:
    app.kubernetes.io/name: opencode
    app.kubernetes.io/component: homebrew
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
