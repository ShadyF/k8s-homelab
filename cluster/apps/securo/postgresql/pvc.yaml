apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: securo-postgresql-data
  namespace: securo
  labels:
    app.kubernetes.io/name: securo-postgresql
    app.kubernetes.io/part-of: securo
    securo.homelab/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: longhorn
