apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: securo-redis-data
  namespace: securo
  labels:
    app.kubernetes.io/name: securo-redis
    app.kubernetes.io/part-of: securo
    securo.homelab/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
