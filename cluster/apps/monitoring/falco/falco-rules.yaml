apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-rules-configmap
  namespace: monitoring
data:
  rules.yaml: |-
    customRules:
      custom-rules.yaml: |-
        - macro: user_known_contact_k8s_api_server_activities
          condition: >
            or container.image.repository in (
              quay.io/kiwigrid/k8s-sidecar, 
              docker.io/kiwigrid/k8s-sidecar, 
              docker.io/longhornio/longhorn-manager, 
              docker.io/longhornio/longhorn-share-manager,
              docker.io/longhornio/longhorn-instance-manager,
              docker.io/longhornio/csi-resizer,
              quay.io/jetstack/cert-manager-webhook,
              quay.io/metallb/controller,
              docker.io/falcosecurity/k8s-metacollector,
              quay.io/metallb/speaker
            )
            or (k8smeta.ns.name == "default" and k8smeta.pod.name startswith "opencode-" and k8smeta.pod.label[app.kubernetes.io/name] == "opencode" and container.name == "openchamber" and container.image.repository == "mcr.microsoft.com/devcontainers/universal" and proc.name == "kubectl" and proc.exepath == "/usr/local/bin/kubectl")
          override:
            condition: append

        - macro: user_expected_terminal_shell_in_container_conditions
          condition: >
            or (k8smeta.ns.name == "default" and k8smeta.pod.name startswith "opencode-" and k8smeta.pod.label[app.kubernetes.io/name] == "opencode" and container.name == "dind" and container.image.repository == "docker.io/library/docker" and proc.name == "sh" and proc.exepath == "/bin/busybox" and proc.cmdline == "sh -c command -v bash >/dev/null && exec bash || exec sh")
          override:
            condition: append

        - macro: known_drop_and_execute_activities
          condition: >
            or (container.image.repository == "ghcr.io/flaresolverr/flaresolverr" and proc.name == "chromedriver")
            or (k8smeta.ns.name == "default" and k8smeta.pod.name startswith "flaresolverr-" and proc.name == "chromedriver" and proc.exepath == "/app/chromedriver" and user.name == "flaresolverr")
            or (container.image.repository == "docker.io/library/alpine" and proc.name == "stunnel" and k8s.ns.name == "monitoring" and proc.exepath == "/usr/bin/stunnel")
            or (container.image.repository == "docker.io/library/alpine" and proc.name == "c_rehash" and k8s.ns.name == "monitoring" and proc.exepath == "/usr/bin/c_rehash")
            or (container.image.repository == "docker.io/library/alpine" and proc.name == "update-ca-certificates" and k8s.ns.name == "monitoring" and proc.exepath == "/usr/sbin/update-ca-certificates")
          override:
            condition: append

        - macro: user_known_stand_streams_redirect_activities
          condition: or (container.image.repository == "docker.io/longhornio/longhorn-manager" and proc.name == "longhorn")
          override:
            condition: append

        # Allow only the DinD overlayfs mount used when containerd rotates dpkg.log.
        - macro: allowed_clear_log_files
          condition: >
            or (container.image.repository == "docker.io/longhornio/longhorn-instance-manager" and proc.name == "tee" and fd.name == "/var/log/tgtd.log")
            or (k8smeta.ns.name == "default" and k8smeta.pod.name startswith "opencode-" and k8smeta.pod.label[app.kubernetes.io/name] == "opencode" and container.name == "dind" and container.image.repository == "docker.io/library/docker" and container.image.tag == "29.7.2-dind" and proc.name == "containerd" and proc.pname == "dockerd" and proc.exepath == "/usr/local/bin/containerd" and user.uid == 0 and fd.name startswith "/var/lib/docker/containerd/daemon/io.containerd.snapshotter.v1.overlayfs/snapshots/" and fd.name endswith "/fs/var/log/dpkg.log")
          override:
            condition: append

        - macro: user_read_sensitive_file_conditions
          condition: >
            or (container.image.repository == "docker.io/library/alpine" and proc.name == "adduser" and k8s.ns.name == "monitoring")
          override:
            condition: append

        - list: user_known_packet_socket_binaries
          items: [speaker]
          override:
            items: append

        # Allow the privileged OpenCode DinD daemon to create its required packet socket.
        - rule: Packet socket created in container
          exceptions:
            - name: opencode_dind_dockerd_packet_socket
              fields: [k8smeta.ns.name, k8smeta.pod.name, "k8smeta.pod.label[app.kubernetes.io/name]", container.name, container.image.repository, container.image.tag, proc.name, proc.pname, proc.exepath, user.uid, fd.sockfamily]
              comps: [=, startswith, =, =, =, =, =, =, =, =, =]
              values: [default, opencode-, opencode, dind, docker.io/library/docker, 29.7.2-dind, dockerd, docker-init, /usr/local/bin/dockerd, 0, packet]
          append: true
