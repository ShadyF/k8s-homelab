# Adapted from the following sources:
# https://www.redhat.com/sysadmin/harden-new-system-ansible
# https://github.com/onedr0p/home-ops/blob/main/ansible/main/playbooks/cluster-prepare.yaml
---
- name: Prepare System
  # Require an explicit target so an omitted variable cannot select every host.
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    new_user: worker
    unnecessary_services:
      - postfix
      - telnet
    unnecessary_software:
      - tcpdump
      - ncat
      - wpasupplicant
      - snapd
  pre_tasks:
    - name: Pausing for 2 seconds...
      ansible.builtin.pause:
        seconds: 2
  tasks:
    - name: Packages
      block:
        - name: Packages | Update and Upgrade
          apt:
            update_cache: true
            upgrade: true
            cache_valid_time: 86400 #One day
        - name: Packages | Install
          apt:
            name: htop,ncdu,lm-sensors,gnupg,fish,curl,apt-transport-https,ca-certificates,nfs-common,nfs-kernel-server,open-iscsi,nano
            install_recommends: false

    - name: User Configuration
      block:
        - name: Add admin group
          group:
            name: admin
            state: present
          register: admin_group
        # Avoid checking the dependent user until a missing group is created in check mode.
        - name: Add local user
          user:
            name: "{{ new_user }}"
            group: admin
            shell: /bin/bash
            home: "/home/{{ new_user }}"
            create_home: yes
            state: present
          when: not (ansible_check_mode and admin_group.changed)
        - name: Add SSH public key for user
          authorized_key:
            user: "{{ new_user }}"
            key: "https://github.com/{{ github_username }}.keys"
            state: present
        - name: Add sudoer rule for local user
          copy:
            content: |
              {{ new_user }} ALL=(ALL:ALL) NOPASSWD:ALL
            dest: "/etc/sudoers.d/{{ new_user }}"
            owner: root
            group: root
            mode: 0440
            validate: /usr/sbin/visudo -csf %s

    - name: Disable unused software and services
      block:
        - name: Disable unused software and services | Remove undesirable packages
          package:
            name: "{{ unnecessary_software }}"
            state: absent
        - name: Disable unused software and services | Stop and disable unnecessary services
          service:
            name: "{{ item }}"
            state: stopped
            enabled: no
          with_items: "{{ unnecessary_services }}"
          ignore_errors: yes

    - name: System Configuration
      block:
        - name: System Configuration | Configure Longhorn node prerequisites
          ansible.builtin.include_tasks: tasks/longhorn-node-prereqs.yaml
        # Remove persistent swap entries before disabling active swap.
        - name: System Configuration | Remove uncommented swap entries from fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^\s*[^#\s]\S*\s+\S+\s+swap(?:\s|$)'
            state: absent
        - name: System Configuration | Disable active swap
          ansible.builtin.command:
            cmd: swapoff -a
          when: ansible_swaptotal_mb | int > 0
          changed_when: not ansible_check_mode and (ansible_swaptotal_mb | int > 0)
        # Validate the hardened configuration before replacing the active SSH config.
        - name: System Configuration | Add hardened SSH config
          notify: Reload SSH
          ansible.builtin.copy:
            src: files/sshd_config
            dest: /etc/ssh/sshd_config
            owner: root
            group: root
            mode: "0600"
            validate: /usr/sbin/sshd -t -f %s

    - name: Network Configuration
      notify: Reboot
      block:
        - name: Network Configuration | Set hostname
          hostname:
            name: "{{ inventory_hostname }}"

# If installing k3s on this machine, need to add the following to /etc/systemd/system/k3s.service to make prometheus metrics work
#  ExecStart=/usr/local/bin/k3s \
#  server \
#      '--server' \
#      'https://192.168.1.200:6443' \
#      '--disable' \
#      'servicelb' \
#      '--disable' \
#      'traefik' \
#      '--kube-controller-manager-arg' \
#      'bind-address=0.0.0.0' \
#      '--kube-proxy-arg' \
#      'metrics-bind-address=0.0.0.0' \
#      '--kube-scheduler-arg' \
#      'bind-address=0.0.0.0' \
#      '--etcd-expose-metrics' \
#      'true' \

  handlers:
    - name: Reload SSH
      service:
        name: ssh
        state: reloaded
    - name: Reboot
      reboot:
        msg: Rebooting nodes
        reboot_timeout: 3600
